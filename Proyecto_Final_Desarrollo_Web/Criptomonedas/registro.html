<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - CriptoSim</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="auth-body">
    <!-- Navbar -->
    <nav class="navbar">
        <div class="nav-brand">
            <h2>🪙 CriptoSim</h2>
        </div>
        <div class="nav-links">
            <a href="index.html" class="btn-login">Inicio</a>
            <a href="login.html" class="btn-register">Iniciar Sesión</a>
        </div>
    </nav>

    <!-- Register Container -->
    <div class="auth-container">
        <div class="auth-card">
            <h2>Crear Cuenta</h2>
            <p class="auth-subtitle">Únete a CriptoSim y recibe $10,000 virtuales</p>
            
            <form id="registerForm" class="auth-form">
                <div class="form-group">
                    <label for="fullName">Nombre Completo</label>
                    <input type="text" id="fullName" name="fullName" required placeholder="Juan Pérez">
                </div>
                
                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" name="email" required placeholder="tu@email.com">
                </div>
                
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" required placeholder="••••••••">
                    <small>Mínimo 6 caracteres</small>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirmar Contraseña</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="••••••••">
                </div>

                <div class="form-group">
                    <label>
                        <input type="checkbox" id="terms" name="terms" required>
                        Acepto los <a href="#" style="color: #667eea;">términos y condiciones</a>
                    </label>
                </div>

                <button type="submit" class="btn-auth">Crear Cuenta</button>
            </form>

            <div class="auth-links">
                <p>¿Ya tienes cuenta? <a href="login.html">Inicia sesión aquí</a></p>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
