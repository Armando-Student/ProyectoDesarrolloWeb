<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - CriptoSim</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="auth-body">
    <!-- Navbar -->
    <nav class="navbar">
        <div class="nav-brand">
            <h2>🪙 CriptoSim</h2>
        </div>
        <div class="nav-links">
            <a href="index.html" class="btn-login">Inicio</a>
            <a href="registro.html" class="btn-register">Registrarse</a>
        </div>
    </nav>

    <!-- Login Container -->
    <div class="auth-container">
        <div class="auth-card">
            <h2>Iniciar Sesión</h2>
            <p class="auth-subtitle">Ingresa a tu cuenta de CriptoSim</p>
            
            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" name="email" required placeholder="tu@email.com">
                </div>
                
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" required placeholder="••••••••">
                </div>

                <button type="submit" class="btn-auth">Ingresar</button>
            </form>

            <div class="auth-links">
                <p>¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a></p>
                <p><a href="#">¿Olvidaste tu contraseña?</a></p>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
